<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="styles/style.css" rel="stylesheet"/>
    <link href="styles/lecteur-audio.css" rel="stylesheet"/>
    <title>Réservation - Le Café Sodium</title>
    <link rel="icon" type="image/png" href="img/So.png">
</head>
<body>

    <!-- structure du lecteur audio -->
  <div class="audio-player" id="audioPlayer">

    <button class="player-tab" id="playerTab" type="button"
            aria-label="Afficher ou masquer le lecteur"
            title="Afficher / masquer le lecteur">
      <span id="tabIcon">‹</span>
    </button>

    <div class="player-card">

      <div class="cover-wrapper">
        <img id="cover" src="img/So.png" alt="Pochette">
      </div>

      <div class="player-main">

        <div class="track-info">
          <div class="track-title" id="trackTitle">Chargement...</div>
          <div class="track-artist" id="trackArtist">—</div>
        </div>

        <div class="controls">
          <button id="prevBtn" class="control-btn" type="button" title="Précédent">⏮</button>
          <button id="playBtn" class="play-btn" type="button" title="Lecture / pause">▶</button>
          <button id="nextBtn" class="control-btn" type="button" title="Suivant">⏭</button>
        </div>

        <div class="progress-row">
          <span id="currentTime">0:00</span>
          <input id="progress" type="range" min="0" max="100" value="0" step="0.1">
          <span id="duration">0:00</span>
        </div>

        <div class="bottom-row">
          <div class="volume">
            <span>🔊</span>
            <input id="volume" type="range" min="0" max="1" value="1" step="0.01">
          </div>

          <div class="track-counter" id="trackCounter">0 / 0</div>
        </div>

      </div>
    </div>
  </div>

  <audio id="audio" preload="metadata"></audio>

  <script src="scripts/audio.js" defer></script>

<div class="hero">

    <video autoplay loop muted plays-inline class="back-video">
        <source src="img/Kávé összefoglaló - marketing videó.mp4" type="video/mp4">
    </video>

    <nav>
        <a href="index.html">
            <img src="./img/rien.JPG" alt="Logo Sodium" class="logo">
        </a>
        <ul>
            <li>
                <a href="carte.html">Notre Carte</a>
                <a href="reservation.html">Réservation</a>
                <a href="contact.html">Nous contacter</a>
                <a href="suggestion.html">Idées/Suggestion ?</a>
            </li>
        </ul>
    </nav>
    <div class="content">
        <h1>Café Sodium</h1>
        <a href="index.html">Toujours pas..</a>
    </div>
</div>


    </nav>
    <footer>
        <p>© 2026 Café Sodium, Tous droits réservés</p>
    </footer>
</body>
</html>
